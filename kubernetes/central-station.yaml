apiVersion: apps/v1
kind: Deployment
metadata:
  name: central-station
spec:
  replicas: 1
  selector:
    matchLabels:
      app: central-station
  template:
    metadata:
      labels:
        app: central-station
    spec:
      containers:
        - name: central-station
          image: central-station:1.0
          imagePullPolicy: Never
          env:
            - name: KAFKA_SERVER
              value: "kafka-service:9092"

            - name: DATABASE_URL
              value: "jdbc:postgresql://postgres-service:5432/weather"
